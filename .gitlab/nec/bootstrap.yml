include:
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/iac/plan@main
    inputs:
      stage: deploy
      job_name: terraform-plan-nec-bootstrap-dev
      root_dir: ./terraform-aws/bootstrap
      environment: dev
      rules:
        - !reference [.on_manual_nec_bootstrap]
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/iac/apply@main
    inputs:
      stage: deploy
      job_name: terraform-apply-nec-bootstrap-dev
      root_dir: ./terraform-aws/bootstrap
      environment: dev
      rules:
        - !reference [.on_manual_nec_bootstrap]

# override rules to pass in the proper variables and tags
terraform-plan-nec-bootstrap-dev:
  environment: dev
  variables:
    ROLE_NAME: $NEC_ROLE_NAME
    ACCOUNT_ID: $NEC_ACCOUNT_ID
  tags:
    - nec-cloud
terraform-apply-nec-bootstrap-dev:
  environment: dev
  variables:
    ROLE_NAME: $NEC_ROLE_NAME
    ACCOUNT_ID: $NEC_ACCOUNT_ID
  needs:
    - job: terraform-plan-nec-bootstrap-dev
      artifacts: true
  tags:
    - nec-cloud
