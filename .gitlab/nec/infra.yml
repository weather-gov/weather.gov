include:
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/iac/plan@main
    inputs:
      stage: deploy
      job_name: terraform-plan-nec-infra-dev
      root_dir: ./terraform-aws/envs/dev
      environment: dev
      rules:
        - !reference [.on_manual_nec_deploy]
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/iac/apply@main
    inputs:
      stage: deploy
      job_name: terraform-apply-nec-infra-dev
      root_dir: ./terraform-aws/envs/dev
      environment: dev
      rules:
        - !reference [.on_manual_nec_deploy]

# override rules to pass in the proper variables and tags
terraform-plan-nec-infra-dev:
  environment: dev
  variables:
    ROLE_NAME: $NEC_ROLE_NAME
    ACCOUNT_ID: $NEC_ACCOUNT_ID
  # needs:
  #   - job: terraform-apply-nec-bootstrap-dev
  #     optional: true
  tags:
    - nec-cloud
terraform-apply-nec-infra-dev:
  environment: dev
  variables:
    ROLE_NAME: $NEC_ROLE_NAME
    ACCOUNT_ID: $NEC_ACCOUNT_ID
  needs:
    - job: terraform-plan-nec-infra-dev
      artifacts: true
  tags:
    - nec-cloud
