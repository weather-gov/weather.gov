include:
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/security/sast@main
    inputs:
      excluded_paths: "spec, test, tests, tmp, node_modules, forecast/frontend/assets/js/uswds*.js, forecast/frontend/assets/js/third-party, forecast/frontend/assets/js/cmi-radar*.js, forecast/frontend/public/js"
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/security/dependency_scanning@main
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/security/container_scanning@main
    inputs:
      job_name: scan-django-production-image
      image: $CI_REGISTRY_IMAGE/django-production:$CI_COMMIT_SHORT_SHA
      dockerfile: forecast/Dockerfile.prod
      git_strategy: fetch
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/security/container_scanning@main
    inputs:
      job_name: scan-tasks-ghwo-production-image
      image: $CI_REGISTRY_IMAGE/tasks-ghwo-production:$CI_COMMIT_SHORT_SHA
      dockerfile: tasks/Dockerfile.prod
      git_strategy: fetch
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/security/container_scanning@main
    inputs:
      job_name: scan-tasks-alerts-production-image
      image: $CI_REGISTRY_IMAGE/tasks-alerts-production:$CI_COMMIT_SHORT_SHA
      dockerfile: tasks/Dockerfile.prod
      git_strategy: fetch
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/security/container_scanning@main
    inputs:
      job_name: scan-tasks-gridcache-production-image
      image: $CI_REGISTRY_IMAGE/tasks-gridcache-production:$CI_COMMIT_SHORT_SHA
      dockerfile: tasks/Dockerfile.prod
      git_strategy: fetch

# override needs so that scanning runs on targeted containers
scan-django-production-image:
  needs:
    - job: push-django-production-image
      optional: true
  rules:
    - !reference [.on_mr_forecast_changes]
    - !reference [.on_main]
scan-tasks-ghwo-production-image:
  needs:
    - job: push-tasks-ghwo-production-image
      optional: true
  rules:
    - !reference [.on_mr_tasks_changes]
    - !reference [.on_main]
scan-tasks-alerts-production-image:
  needs:
    - job: push-tasks-alerts-production-image
      optional: true
  rules:
    - !reference [.on_mr_tasks_changes]
    - !reference [.on_main]
scan-tasks-gridcache-production-image:
  needs:
    - job: push-tasks-gridcache-production-image
      optional: true
  rules:
    - !reference [.on_mr_tasks_changes]
    - !reference [.on_main]
