include:
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/utility/anchors@main
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/container/build@main
    inputs:
      stage: gather
      job_name: gather-node-dependencies
      dockerfile: Dockerfile.node.ci
      context: ./
      image: $CI_REGISTRY_IMAGE/node-with-deps
      needs: ["compute-dependency-tags"]
      tag: $JS_TAG
      opts: "--cache=true --cache-copy-layers=true --cache-repo=$CI_REGISTRY_IMAGE/cache --cache-ttl=168h"
      before_script:
        - |
          if [ "$JS_NEEDS_BUILD" = "false" ]; then
            echo "node-with-deps:$JS_TAG is already in the gitlab container registry. Skipping the build."
            echo "BUILD_IMAGE=$CI_REGISTRY_IMAGE/node-with-deps" > build.env
            echo "BUILD_TAG=$JS_TAG" >> build.env
            exit 0
          fi
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/container/build@main
    inputs:
      stage: gather
      job_name: gather-django-dependencies
      dockerfile: Dockerfile.ci
      context: forecast/
      image: $CI_REGISTRY_IMAGE/python-with-deps
      needs: ["compute-dependency-tags"]
      tag: $PY_TAG
      opts: "--cache=true --cache-copy-layers=true --cache-repo=$CI_REGISTRY_IMAGE/cache --cache-ttl=168h"
      before_script:
        - |
          if [ "$PY_NEEDS_BUILD" = "false" ]; then
            echo "python-with-deps:$PY_TAG is already in the gitlab container registry. Skipping the build."
            echo "BUILD_IMAGE=$CI_REGISTRY_IMAGE/python-with-deps" > build.env
            echo "BUILD_TAG=$PY_TAG" >> build.env
            exit 0
          fi
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/container/build@main
    inputs:
      stage: gather
      job_name: gather-playwright-dependencies
      dockerfile: Dockerfile.playwright.ci
      context: ./
      image: $CI_REGISTRY_IMAGE/playwright
      needs: ["compute-dependency-tags"]
      tag: $PW_TAG
      opts: "--cache=true --cache-copy-layers=true --cache-repo=$CI_REGISTRY_IMAGE/cache --cache-ttl=168h"
      before_script:
        - |
          if [ "$PW_NEEDS_BUILD" = "false" ]; then
            echo "playwright:$PW_TAG is already in the gitlab container registry. Skipping the build."
            echo "BUILD_IMAGE=$CI_REGISTRY_IMAGE/playwright" > build.env
            echo "BUILD_TAG=$PW_TAG" >> build.env
            exit 0
          fi
  - component: ${CI_SERVER_FQDN}/NWS/Systems/NCO/NEC/shared-catalogs/container/build@main
    inputs:
      stage: gather
      job_name: push-django-production-image
      dockerfile: Dockerfile.prod
      context: forecast/
      image: $CI_REGISTRY_IMAGE/django-production
      tag: $CI_COMMIT_REF_SLUG
      opts: "--cache=true --cache-copy-layers=true --cache-repo=$CI_REGISTRY_IMAGE/cache --cache-ttl=168h"

# override rules so these jobs are in the pipeline on each push. NB:
# `before_script` determines whether they actually build images.
gather-node-dependencies:
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_release_tag]
    - !reference [.on_web]
gather-django-dependencies:
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_web]
push-django-production-image:
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_web]
# NB: currently playwright is only run from the Gitlab UI
gather-playwright-dependencies:
  rules:
    - !reference [.on_manual_playwright_ci]
