{% comment %}
-- Template purpose:
--   Display the day selectors on the "7 Days" tab.
-- Used by: partials/forecast.html
{% endcomment %}
<div class="wx-quick-forecast grid-col-12 margin-bottom-2"
     data-tablist-label="{% trans 'daily-forecast.aria.day-tabs.01' %}">

    {% quick_forecast_link_item day=day first=forloop.first %}
  {% endfor %}
</div>
