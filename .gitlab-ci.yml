spec:
  # these inputs permit flexible pipeline runs from the GitLab UI
  inputs:
    deploy-to-environment:
      options: ["no deploy", "test", "staging", "prod"]
      default: "no deploy"
      description: "Deploy the selected branch or tag to this environment using Terraform. You do not need to build the images or run the tests, although you can if you like. At the time of writing (9/25), 'prod' means beta.weather.gov."
    confirm-beta-deploy:
      description: "To deploy to beta, type YES in this box."
      default: ""
    confirm-nec-deploy:
      description: "To deploy to NEC, type NEC in this box."
      default: ""
    confirm-nec-bootstrap:
      description: "To bootstrap a Terraform state bucket for NEC, type in BOOTSTRAP in this box."
      default: ""
    build-images:
      type: boolean
      default: true
      description: "Build Docker images containing 3rd party dependencies using the config files on the selected branch. Images are tagged with the branch slug and pushed to the NOAA GitLab container registry."
    run-django-ci:
      type: boolean
      default: true
      description: "Lint and test Django in the selected branch using config from that branch. Uses dependencies from main, unless `build-images` is true."
    run-js-ci:
      type: boolean
      default: true
      description: "Lint and test JS in the selected branch using config from that branch. Uses dependencies from main, unless `build-images` is true."
    run-golang-ci:
      type: boolean
      default: true
      description: "Run golang tests in the selected branch using config from that branch. Uses dependencies from main, unless `build-images` is true."
    run-playwright-ci:
      type: boolean
      default: false
      description: "Run playwright end-to-end and accessibility tests in the selected branch using config from that branch."
---
stages:
  - gather # gather the 3rd party dependencies and push images of them to the registry
  - lint # pull the code images and lint
  - build # perform any necesary build steps
  - test # pull the code images and test
  - notes # write the release notes and any other pre-release activities
  - release # create a release, which is stored in GitLab (the software, not the code repository)
  - deploy # toss the selected branch/tag into the desired live environment

# these are available in all the running containers (images and services)
variables:
  API_URL: https://api.weather.gov
  GHWO_URL: https://www.weather.gov
  POSTGRES_USER: drupal
  POSTGRES_PASSWORD: drupal
  POSTGRES_DB: weathergov
  DJANGO_SETTINGS_MODULE: backend.config.settings.ci
  # promote gitlab inputs to variables so we can use them in rules.
  BUILD_IMAGES: "$[[ inputs.build-images ]]"
  RUN_JS_CI: "$[[ inputs.run-js-ci ]]"
  RUN_DJANGO_CI: "$[[ inputs.run-django-ci ]]"
  RUN_GOLANG_CI: "$[[ inputs.run-golang-ci ]]"
  RUN_PLAYWRIGHT_CI: "$[[ inputs.run-playwright-ci ]]"
  DEPLOY_TO_ENVIRONMENT: "$[[ inputs.deploy-to-environment ]]"
  CONFIRM_BETA_DEPLOY: "$[[ inputs.confirm-beta-deploy ]]"
  CONFIRM_NEC_DEPLOY: "$[[ inputs.confirm-nec-deploy ]]"
  CONFIRM_NEC_BOOTSTRAP: "$[[ inputs.confirm-nec-bootstrap ]]"
  # enable SAST as per Gitlab security scanning
  AST_ENABLE_MR_PIPELINES: "true"

# determine which events produce a pipeline. see .gitlab/rules.yml for job-specific rules.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-beta$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# set up NEC-specific CI/CD jobs
include:
  - local: ".gitlab/rules.yml"
  - local: ".gitlab/nec/bootstrap.yml"
  - local: ".gitlab/nec/infra.yml"
  - local: ".gitlab/nec/containers.yml"
  - template: Security/SAST.gitlab-ci.yml

# gather up commits which have a `Changelog: ...` trailer and push them to CHANGELOG.md (via GitLab's API)
write-release-notes:
  stage: notes
  image: alpine:latest
  script:
    - apk add curl jq
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?version=$CI_COMMIT_TAG" | jq -r .notes | tee release_notes.md'
    - 'curl -H "PRIVATE-TOKEN: $CI_API_TOKEN" -X POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/changelog?branch=changelog&version=$CI_COMMIT_TAG"'
  artifacts:
    paths:
      - release_notes.md
  rules:
    - !reference [.on_release_tag]

# create a release (in GitLab) using the markdown release notes from the pervious job
make-tagged-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: write-release-notes
      artifacts: true
  script:
    - echo "Making release $CI_COMMIT_TAG from tag $CI_COMMIT_TAG at commit $CI_COMMIT_SHA."
  release:
    name: "$CI_COMMIT_TAG"
    description: release_notes.md
    tag_name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_SHA"
  rules:
    - !reference [.on_release_tag]

# deploy to prod/beta automatically on a beta version tag (like `beta-v1.3.5`) or manually from the GitLab New Pipeline page
deploy-to-prod:
  stage: deploy
  image: cloudfoundry/cli:8
  needs:
    - job: bundle-js
      artifacts: true
  script:
    - apk update && apk upgrade && apk add --no-cache bash jq curl grep git coreutils unzip zip
    - wget https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip
    - unzip -d /usr/bin terraform_1.13.3_linux_amd64.zip
    - terraform --version
    - cd terraform/
    - >
      echo {
      \"django_secret_key\": \"$CI_PROD_DJANGO_SECRET_KEY\",
      \"newrelic_license\": \"$CI_NEW_RELIC_LICENSE\",
      \"sp_private_key\": \"$CI_PROD_SP_PRIVATE_KEY\",
      \"sp_public_key\": \"$CI_PROD_SP_PUBLIC_KEY\"
      } > credentials-prod.json
    - |
      echo -e \
      cf_user = \"$CI_PROD_CF_USER\"\\n\
      cf_password = \"$CI_PROD_CF_PASSWORD\" \
      > secrets.cicd.auto.tfvars
    - |
      echo -e \
      bucket     = \"$CI_TF_STATE_MGMT_BUCKET\"\\n\
      region     = \"$CI_TF_STATE_MGMT_REGION\"\\n\
      access_key = \"$CI_TF_STATE_MGMT_ACCESS_KEY\"\\n\
      secret_key = \"$CI_TF_STATE_MGMT_SECRET_KEY\" \
      > secrets.backend.tfvars
    - terraform init -backend-config=secrets.backend.tfvars -backend-config="key=terraform.tfstate.weathergov-prod" -reconfigure
    - terraform apply -var="git_sha_hash=$(git rev-parse HEAD)" -var-file="weathergov-prod.tfvars" -auto-approve
  rules:
    - !reference [.on_release_tag]
    - !reference [.on_manual_deploy_prod]

# deploy to staging automatically when main is updated
deploy-to-staging:
  stage: deploy
  image: cloudfoundry/cli:8
  needs:
    - job: bundle-js
      artifacts: true
  script:
    - apk update && apk upgrade && apk add --no-cache bash jq curl grep git coreutils unzip zip
    - wget https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip
    - unzip -d /usr/bin terraform_1.13.3_linux_amd64.zip
    - terraform --version
    - cd terraform/
    - >
      echo {
      \"django_secret_key\": \"$CI_STAGING_DJANGO_SECRET_KEY\",
      \"newrelic_license\": \"$CI_NEW_RELIC_LICENSE\",
      \"sp_private_key\": \"$CI_STAGING_SP_PRIVATE_KEY\",
      \"sp_public_key\": \"$CI_STAGING_SP_PUBLIC_KEY\"
      } > credentials-staging.json
    - |
      echo -e \
      cf_user = \"$CI_CF_USER\"\\n\
      cf_password = \"$CI_CF_PASSWORD\" \
      > secrets.cicd.auto.tfvars
    - |
      echo -e \
      bucket     = \"$CI_TF_STATE_MGMT_BUCKET\"\\n\
      region     = \"$CI_TF_STATE_MGMT_REGION\"\\n\
      access_key = \"$CI_TF_STATE_MGMT_ACCESS_KEY\"\\n\
      secret_key = \"$CI_TF_STATE_MGMT_SECRET_KEY\" \
      > secrets.backend.tfvars
    - terraform init -backend-config=secrets.backend.tfvars -backend-config="key=terraform.tfstate.weathergov-staging" -reconfigure
    - terraform apply -var="git_sha_hash=$(git rev-parse HEAD)" -var-file="weathergov-staging.tfvars" -auto-approve
  rules:
    - !reference [.on_main]
    - !reference [.on_manual_deploy_staging]

# deploy to test manually from the GitLab New Pipeline page
deploy-to-test:
  stage: deploy
  image: cloudfoundry/cli:8
  needs:
    - job: bundle-js
      artifacts: true
  script:
    - apk update && apk upgrade && apk add --no-cache bash jq curl grep git coreutils unzip zip
    - wget https://releases.hashicorp.com/terraform/1.13.3/terraform_1.13.3_linux_amd64.zip
    - unzip -d /usr/bin terraform_1.13.3_linux_amd64.zip
    - terraform --version
    - cd terraform/
    - >
      echo {
      \"django_secret_key\": \"$CI_TEST_DJANGO_SECRET_KEY\",
      \"newrelic_license\": \"$CI_NEW_RELIC_LICENSE\",
      \"sp_private_key\": \"$CI_TEST_SP_PRIVATE_KEY\",
      \"sp_public_key\": \"$CI_TEST_SP_PUBLIC_KEY\"
      } > credentials-test.json
    - |
      echo -e \
      cf_user = \"$CI_CF_USER\"\\n\
      cf_password = \"$CI_CF_PASSWORD\" \
      > secrets.cicd.auto.tfvars
    - |
      echo -e \
      bucket     = \"$CI_TF_STATE_MGMT_BUCKET\"\\n\
      region     = \"$CI_TF_STATE_MGMT_REGION\"\\n\
      access_key = \"$CI_TF_STATE_MGMT_ACCESS_KEY\"\\n\
      secret_key = \"$CI_TF_STATE_MGMT_SECRET_KEY\" \
      > secrets.backend.tfvars
    - terraform init -backend-config=secrets.backend.tfvars -backend-config="key=terraform.tfstate.weathergov-test" -reconfigure
    - terraform apply -var="git_sha_hash=$(git rev-parse HEAD)" -var-file="weathergov-test.tfvars" -auto-approve
  rules:
    - !reference [.on_manual_deploy_test]

# determine whether or not we need to rebuild images.
compute-dependency-tags:
  stage: .pre
  image: alpine:latest
  script:
    - JS_DEPS="Dockerfile.node.ci package-lock.json api-interop-layer/package-lock.json api-proxy/package-lock.json spatial-data/package-lock.json"
    - PY_DEPS="forecast/Dockerfile.ci forecast/requirements.dev.txt"
    - PW_DEPS="Dockerfile.playwright.ci package-lock.json"
    - echo "JS_TAG=deps-$(cat $JS_DEPS | sha256sum | cut -c1-12)" > deps.env
    - echo "PY_TAG=deps-$(cat $PY_DEPS | sha256sum | cut -c1-12)" >> deps.env
    - echo "PW_TAG=deps-$(cat $PW_DEPS | sha256sum | cut -c1-12)" >> deps.env
    - cat deps.env
  artifacts:
    reports:
      dotenv: deps.env

.playwright:
  stage: test
  needs:
    - job: compute-dependency-tags
    - job: gather-playwright-dependencies
      optional: true
  image: $CI_REGISTRY_IMAGE/playwright:$PW_TAG
  variables:
    DEPLOYED_URL: https://weathergov-test.app.cloud.gov
    API_URL: https://api-proxy-weathergov-test.app.cloud.gov/
    WEB_URL: $DEPLOYED_URL
  rules:
    - !reference [.on_manual_playwright_ci]

# run end-to-end tests against the deployed environment
playwright-e2e:
  extends: [.playwright]
  parallel: 3
  script:
    - ln -s /app/node_modules/ .
    - echo Attempting to run end-to-end tests against $DEPLOYED_URL
    - npx playwright test e2e_$CI_NODE_INDEX

# run accessibility tests against the deployed environment
playwright-a11y:
  extends: [.playwright]
  script:
    - ln -s /app/node_modules/ .
    - echo Attempting to run a11y tests against $DEPLOYED_URL
    - CI=true npx playwright test a11y

bundle-js:
  stage: build
  needs:
    - job: compute-dependency-tags
    - job: gather-node-dependencies
      optional: true
  image: $CI_REGISTRY_IMAGE/node-with-deps:$JS_TAG
  script:
    # NB: GitLab clones into CI_BUILDS_DIR which defaults to
    # /builds/gitlab-licensed/NWS/Systems/DIS/Weather.gov-2.0/ whereas in our Docker
    # images our WORKDIR is /app. so we symlink the various /app/node_modules to
    # CI_BUILDS_DIR so we can "npm run" as needed.
    - ln -s /app/node_modules/ .
    - ln -s /app/api-interop-layer/node_modules api-interop-layer/
    - ln -s /app/api-proxy/node_modules api-proxy
    - npx --no-install esbuild --bundle --minify --format=esm --sourcemap "forecast/frontend/assets/js/**/*.html.js" --outdir=forecast/frontend/assets/js --allow-overwrite
  artifacts:
    paths:
      - forecast/frontend/assets/js/**/*.html.js
      - forecast/frontend/assets/js/**/*.html.js.map
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_release_tag]
    - !reference [.on_manual_js_ci]
    - !reference [.on_manual_deploy_test]
    - !reference [.on_manual_deploy_staging]
    - !reference [.on_manual_deploy_prod]

# lint all JavaScript in the repo in one job
js-lint:
  stage: lint
  needs:
    - job: compute-dependency-tags
    - job: gather-node-dependencies
      optional: true
  image: $CI_REGISTRY_IMAGE/node-with-deps:$JS_TAG
  script:
    # NB: GitLab clones into CI_BUILDS_DIR which defaults to
    # /builds/gitlab-licensed/NWS/Systems/DIS/Weather.gov-2.0/ whereas in our Docker
    # images our WORKDIR is /app. so we symlink the various /app/node_modules to
    # CI_BUILDS_DIR so we can "npm run" as needed.
    - ln -s /app/node_modules/ .
    - ln -s /app/api-interop-layer/node_modules api-interop-layer/
    - ln -s /app/api-proxy/node_modules api-proxy
    - npx --no-install eslint
    - npx --no-install stylelint 'forecast/frontend/**/assets/**/*.scss'
    - |
      npx --no-install prettier --check \
      'forecast/frontend/**/assets/**/*.js' \
      'forecast/frontend/**/assets/**/*.scss' \
      'tests/**/*.js' \
      '*.js' \
      'api-interop-layer/**/*.js' \
      '.gitlab-ci.yml' \
      '.gitlab/**/*.yml'
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_manual_js_ci]

django-lint:
  stage: lint
  needs:
    - job: compute-dependency-tags
    - job: gather-django-dependencies
      optional: true
  image: $CI_REGISTRY_IMAGE/python-with-deps:$PY_TAG
  script:
    - cd forecast/
    - python -m ruff check .
    - python -m djlint backend/templates/ --extension=html
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_manual_django_ci]

django-test:
  stage: test
  needs:
    - job: compute-dependency-tags
    - job: gather-django-dependencies
      optional: true
  image: $CI_REGISTRY_IMAGE/python-with-deps:$PY_TAG
  services:
    - name: postgis/postgis:17-3.5
      alias: database
      variables:
        POSTGRES_USER: drupal
        POSTGRES_PASSWORD: drupal
        POSTGRES_DB: weathergov
  script:
    - cd forecast/
    - ldconfig -p | grep gdal
    - python manage.py migrate
    - python manage.py compilemessages
    - python manage.py collectstatic --noinput --traceback
    - coverage run manage.py test
    - coverage xml -o coverage.xml
    - coverage report
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: forecast/coverage.xml
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_manual_django_ci]

web-component-test:
  stage: test
  needs:
    - job: compute-dependency-tags
    - job: gather-node-dependencies
      optional: true
  image: $CI_REGISTRY_IMAGE/node-with-deps:$JS_TAG
  variables:
    DISABLE_REDIS: true
  script:
    # NB: GitLab clones into CI_BUILDS_DIR which defaults to
    # /builds/gitlab-licensed/NWS/Systems/DIS/Weather.gov-2.0/ whereas in our Docker
    # images our WORKDIR is /app. so we symlink the various /app/node_modules to
    # CI_BUILDS_DIR so we can "npm run" as needed.
    - ln -s /app/node_modules/ .
    - ln -s /app/api-interop-layer/node_modules api-interop-layer/
    - ln -s /app/api-proxy/node_modules api-proxy/
    - npx --no-install c8 --reporter cobertura -o coverage/wc/ --reporter text-summary  mocha --forbid-only --require forecast/frontend/tests/components/preload.js forecast/frontend/tests/components/*-tests.js
  coverage: /^Statements\s*:\s*([^%]+)/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/*/cobertura-coverage.xml
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_manual_js_ci]

interop-test:
  stage: test
  needs:
    - job: compute-dependency-tags
    - job: gather-node-dependencies
      optional: true
  image: $CI_REGISTRY_IMAGE/node-with-deps:$JS_TAG
  variables:
    DISABLE_REDIS: true
  script:
    # NB: GitLab clones into CI_BUILDS_DIR which defaults to
    # /builds/gitlab-licensed/NWS/Systems/DIS/Weather.gov-2.0/ whereas in our Docker
    # images our WORKDIR is /app. so we symlink the various /app/node_modules to
    # CI_BUILDS_DIR so we can "npm run" as needed.
    - ln -s /app/node_modules/ .
    - ln -s /app/api-interop-layer/node_modules api-interop-layer/
    - ln -s /app/api-proxy/node_modules api-proxy/
    - cd api-interop-layer
    # Due to a bug, if you want to set the log level,
    # do `LOG_LEVEL=silent npx...`
    - npx --no-install c8 --reporter cobertura -o ../coverage/interop/ --reporter text-summary mocha --exit '**/*.test.js' --forbid-only --exclude 'node_modules/**' --require mocha.js
  coverage: /^Statements\s*:\s*([^%]+)/
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/*/cobertura-coverage.xml
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_manual_js_ci]

golang-test:
  stage: test
  image: golang:1.26.5-bookworm
  variables:
  script:
    - cd tasks/
    - go test -v ./... -coverprofile=coverage.txt -covermode=count
    - go tool cover -func=coverage.txt
    - go install github.com/boumenot/gocover-cobertura@latest
    - gocover-cobertura < coverage.txt > coverage.xml
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+%)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: tasks/coverage.xml
  rules:
    - !reference [.on_mr]
    - !reference [.on_main]
    - !reference [.on_manual_golang_ci]

sast:
  stage: test
  variables:
    SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, node_modules, forecast/frontend/assets/js/uswds*.js, forecast/frontend/assets/js/third-party, forecast/frontend/assets/js/cmi-radar*.js, forecast/frontend/public/js"
